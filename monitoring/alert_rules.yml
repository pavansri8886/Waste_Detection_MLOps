groups:
  - name: waste-detection-api
    rules:
      - alert: WasteDetectionApiDown
        expr: up{job="api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Waste Detection API is unreachable
          description: Prometheus has not been able to scrape the API for at least 30 seconds.

      - alert: WasteDetectionValidationErrors
        expr: increase(ml_validation_errors_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: High validation error volume
          description: More than five invalid prediction requests were received in the last five minutes.
